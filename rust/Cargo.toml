[package]
name = "release-organizer"
version = "1.6.0"
edition = "2021"
description = "GitHub Release downloader and platform organizer"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
ureq = { version = "2.10", features = ["json", "tls"] }
serde_json = "1.0"
egui_extras = "0.29"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
