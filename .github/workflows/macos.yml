name: macOS build

# 在真 Mac 上编译 arm64 + x86_64 并合成通用二进制，打成 .app 再压缩成 zip。
# 之所以放 CI 而不是本机：Windows 交叉编译不出带 AppKit 的 macOS 可执行文件。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要把 zip 附到哪个 Release（如 v1.6.7），留空则只产出 Artifact"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: universal (arm64 + x86_64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 目标
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version
          cargo --version

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -m1 '^version' rust/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION"

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: macos-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: 编译 arm64
        run: cargo build --release --locked --manifest-path rust/Cargo.toml --target aarch64-apple-darwin

      - name: 编译 x86_64
        run: cargo build --release --locked --manifest-path rust/Cargo.toml --target x86_64-apple-darwin

      - name: 合成通用二进制
        run: |
          set -euo pipefail
          mkdir -p dist
          lipo -create \
            rust/target/aarch64-apple-darwin/release/release-organizer \
            rust/target/x86_64-apple-darwin/release/release-organizer \
            -output dist/release-organizer
          chmod +x dist/release-organizer
          echo "架构：$(lipo -archs dist/release-organizer)"
          file dist/release-organizer

      - name: 打包 .app
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          APP="dist/GitHubReleaseDownloader.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/release-organizer "$APP/Contents/MacOS/release-organizer"

          # 图标：1024 源图 → iconset → icns
          ICONSET="dist/AppIcon.iconset"
          mkdir -p "$ICONSET"
          SRC="rust/assets/icon-1024.png"
          for s in 16 32 128 256 512; do
            d=$((s * 2))
            sips -z "$s" "$s" "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z "$d" "$d" "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          rm -rf "$ICONSET"

          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"

          # Apple Silicon 上未签名的可执行文件无法运行，这里做本机 ad-hoc 签名
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP" 2>&1 | head -5 || true

          cd dist
          zip -qry "GitHub-Release-Downloader-macOS-v${VERSION}-universal.zip" GitHubReleaseDownloader.app
          ls -lh GitHub-Release-Downloader-macOS-v${VERSION}-universal.zip

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/GitHub-Release-Downloader-macOS-*.zip
          if-no-files-found: error

      - name: 附到 Release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "上传到 $TAG"
          gh release upload "$TAG" dist/GitHub-Release-Downloader-macOS-*.zip --clobber
